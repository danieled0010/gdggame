<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>GDG Tech Challenge — Offline Backup</title>
<style>
:root{--ink:#1e1e1e;--blue:#c3ecf6;--green:#ccf6c5;--red:#f8d8d8;--yellow:#ffe7a5}
*{box-sizing:border-box}body{margin:0;background:#f0f0f0;color:var(--ink);font-family:Arial,system-ui,sans-serif}main{max-width:1500px;margin:auto;min-height:100vh;padding:35px 45px;display:flex;flex-direction:column;gap:25px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:2px solid;padding-bottom:16px}.label{font-family:monospace;font-size:15px;font-weight:700}.hero{font-size:clamp(32px,4.5vw,70px);line-height:1.08;letter-spacing:-.05em;max-width:1200px;margin:0}.code{background:#1e1e1e;color:white;padding:20px;border-radius:20px;font-family:monospace;font-size:clamp(15px,2vw,24px);white-space:pre-wrap;overflow-wrap:anywhere}.answers{display:grid;grid-template-columns:1fr 1fr;gap:15px}.answer{border:2px solid var(--ink);border-radius:22px;padding:20px;min-height:110px;display:flex;align-items:center;gap:20px;font-size:clamp(19px,2.2vw,32px);font-weight:700}.answer:nth-child(1){background:var(--blue)}.answer:nth-child(2){background:var(--red)}.answer:nth-child(3){background:var(--yellow)}.answer:nth-child(4){background:var(--green)}.answer b{border:2px solid;padding:14px 20px;border-radius:12px;background:white}.answer.good{outline:6px solid #34a853;outline-offset:2px}.answer.wrong{opacity:.35}.explanation{background:var(--green);padding:16px 22px;border:2px solid;border-radius:15px;font-size:22px;line-height:1.3}.buttons{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:auto;border-top:2px solid;padding-top:20px}button{font:inherit;background:white;color:var(--ink);border:2px solid var(--ink);border-radius:13px;padding:13px 18px;min-height:50px;font-weight:bold;cursor:pointer}button.primary{background:var(--ink);color:white}button:disabled{opacity:.4;cursor:default}.time{font-family:monospace;font-size:40px;font-weight:700;margin-left:auto}.helper{font-size:13px;color:#555}@media(max-width:750px){main{padding:20px}.answers{grid-template-columns:1fr}.answer{min-height:70px}}@media print{.buttons{display:none}}
</style></head><body><main><header class="top"><div class="label">// GDG ON CAMPUS · SAPIENZA / OFFLINE FALLBACK</div><div class="label" id="counter"></div></header><div class="label" id="category"></div><h1 class="hero" id="question"></h1><pre class="code" id="code" style="display:none"></pre><section class="answers" id="answers"></section><div class="explanation" id="explanation" style="display:none"></div><footer class="buttons"><button id="prev">← Previous</button><button class="primary" id="reveal">Reveal answer (Space)</button><button id="next">Next →</button><button id="clock">Start timer</button><span class="time" id="time"></span><div class="helper">Use this file if the campus Wi-Fi blocks LAN multiplayer. Collect A/B/C/D via hands or cards.</div></footer></main>
<script>
const qs=[{"id": "q01", "category": "Git", "difficulty": "warmup", "time_sec": 15, "question": "Which Git command downloads remote updates without merging them into your current branch?", "options": ["git pull", "git fetch", "git merge", "git push"], "correct_index": 1, "explanation": "git fetch downloads remote objects and updates remote-tracking references without merging into the current branch."}, {"id": "q02", "category": "Linux / CLI", "difficulty": "warmup", "time_sec": 15, "question": "Which command recursively searches for the text TODO inside files under src/?", "options": ["grep -n \"TODO\" src/", "find src/ -name \"TODO\"", "ls src/ | grep \"TODO\"", "grep -r \"TODO\" src/"], "correct_index": 3, "explanation": "The -r flag makes grep search files recursively through subdirectories."}, {"id": "q03", "category": "Python", "difficulty": "intermediate", "time_sec": 20, "question": "What will this Python code print?", "code": "data = [1, 2]\nalias = data\nalias.append(3)\nprint(data)", "code_language": "python", "options": ["[1, 2]", "[3]", "[1, 2, 3]", "TypeError"], "correct_index": 2, "explanation": "alias and data refer to the same mutable list; append changes that list in place."}, {"id": "q04", "category": "Networking / HTTP", "difficulty": "intermediate", "time_sec": 20, "question": "An authenticated user requests an API resource but lacks permission. Which HTTP status best fits?", "options": ["403 Forbidden", "401 Unauthorized", "404 Not Found", "500 Internal Server Error"], "correct_index": 0, "explanation": "403 means the server understands the request but refuses authorization; 401 requests authentication credentials."}, {"id": "q05", "category": "JavaScript", "difficulty": "intermediate", "time_sec": 20, "question": "What will this JavaScript code print?", "code": "const values = [1, 2, 3, 4];\nconsole.log(values.filter(x =\u003e x % 2 === 0).map(x =\u003e x * 2));", "code_language": "javascript", "options": ["[2, 4]", "[4, 8]", "[1, 4, 9, 16]", "[2, 4, 6, 8]"], "correct_index": 1, "explanation": "filter selects 2 and 4; map doubles them to 4 and 8."}, {"id": "q06", "category": "Docker", "difficulty": "intermediate", "time_sec": 20, "question": "In docker run -p 8080:80 nginx, which port on your Mac is mapped to port 80 inside the container?", "code": "docker run -p 8080:80 nginx", "code_language": "bash", "options": ["80", "443", "3000", "8080"], "correct_index": 3, "explanation": "Docker -p uses HOST_PORT:CONTAINER_PORT, so host port 8080 forwards to container port 80."}, {"id": "q07", "category": "Linux permissions", "difficulty": "intermediate", "time_sec": 20, "question": "After chmod 640 notes.txt, which permissions does the file have?", "code": "chmod 640 notes.txt", "code_language": "bash", "options": ["Owner read/write; group read; others none", "Owner read/execute; group read/write; others none", "Owner read/write/execute; group read; others none", "Owner read; group write; others read"], "correct_index": 0, "explanation": "Octal 6 means read+write, 4 means read, and 0 means no permissions."}, {"id": "q08", "category": "Cybersecurity / Web", "difficulty": "intermediate", "time_sec": 20, "question": "What does the HttpOnly attribute on a session cookie primarily protect against?", "options": ["Sending cookies over unencrypted HTTP", "Sending cookies in cross-site requests", "JavaScript reading the cookie through document.cookie", "The cookie expiring too soon"], "correct_index": 2, "explanation": "HttpOnly prevents client-side JavaScript from reading the cookie; Secure and SameSite serve different purposes."}, {"id": "q09", "category": "Cybersecurity / SQL", "difficulty": "challenge", "time_sec": 25, "question": "Why is a parameterized query safer than concatenating user input into SQL?", "code": "cursor.execute(\"SELECT * FROM users WHERE email = ?\", (email,))", "code_language": "python", "options": ["It always makes the query run faster", "It separates input data from SQL syntax, reducing SQL injection risk", "It automatically encrypts database fields", "It enforces role-based access control"], "correct_index": 1, "explanation": "Bound parameters are treated as data, so user input cannot change the SQL statement structure."}, {"id": "q10", "category": "Google Developer tools", "difficulty": "challenge", "time_sec": 25, "question": "Which Google/Firebase product is a document-oriented NoSQL database often used in web or mobile apps?", "options": ["Cloud Run", "Firebase Hosting", "Cloud Firestore", "BigQuery"], "correct_index": 2, "explanation": "Cloud Firestore is a document-oriented NoSQL database; the other services serve hosting, compute, or analytics roles."}, {"id": "q11", "category": "AI / Semantic Search", "difficulty": "challenge", "time_sec": 25, "question": "In semantic search, what is the main purpose of a text embedding?", "options": ["Represent text as a numeric vector capturing semantic relationships", "Create an exact keyword index without vectors", "Encrypt a text passage before storing it", "Generate the final chatbot answer directly"], "correct_index": 0, "explanation": "An embedding is a vector representation that lets systems compare semantic similarity."}, {"id": "q12", "category": "JavaScript / Event Loop", "difficulty": "final", "time_sec": 30, "question": "In a typical JavaScript runtime, in what order are these messages logged?", "code": "console.log(\"A\");\nsetTimeout(() =\u003e console.log(\"B\"), 0);\nPromise.resolve().then(() =\u003e console.log(\"C\"));\nconsole.log(\"D\");", "code_language": "javascript", "options": ["A B C D", "A D B C", "A C D B", "A D C B"], "correct_index": 3, "explanation": "Synchronous logs run first (A, D), the Promise microtask runs next (C), then the timer callback (B)."}];let n=0,revealed=false,remaining=0,clock=null;
const el=id=>document.getElementById(id);
const sec=()=>{clearInterval(clock);clock=null;remaining=qs[n].time_sec;el('time').textContent=remaining+'s'};
function render(){let q=qs[n];el('counter').textContent=(n+1)+' / '+qs.length;el('category').textContent='// '+q.category+' · '+q.difficulty.toUpperCase();el('question').textContent=q.question;el('code').style.display=q.code?'block':'none';el('code').textContent=q.code||'';el('answers').replaceChildren(...q.options.map((opt,i)=>{let x=document.createElement('div');x.className='answer'+(revealed?(i===q.correct_index?' good':' wrong'):'');let b=document.createElement('b');b.textContent='ABCD'[i];x.append(b,document.createTextNode(opt));return x}));el('explanation').textContent=q.explanation;el('explanation').style.display=revealed?'block':'none';el('reveal').textContent=revealed?'Hide answer (Space)':'Reveal answer (Space)';el('prev').disabled=n===0;el('next').disabled=n===qs.length-1;}
const jump=delta=>{n=Math.min(qs.length-1,Math.max(0,n+delta));revealed=false;sec();render()};
el('prev').onclick=()=>jump(-1);el('next').onclick=()=>jump(1);el('reveal').onclick=()=>{revealed=!revealed;render()};el('clock').onclick=()=>{sec();clock=setInterval(()=>{remaining=Math.max(0,remaining-1);el('time').textContent=remaining+'s';if(!remaining){clearInterval(clock);clock=null;}},1000)};
document.addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON')return;if(e.key==='ArrowRight')jump(1);else if(e.key==='ArrowLeft')jump(-1);else if(e.code==='Space'){e.preventDefault();el('reveal').click();}});sec();render();
</script></body></html>
